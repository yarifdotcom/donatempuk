<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Donat Empuk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="page-admin">

<!-- Login -->
<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <img src="assets/img/logo.svg" alt="" width="72" height="72">
    <span class="eyebrow">Admin View</span>
    <h1>Masuk admin</h1>
    <label class="field"><span>Password</span>
      <input type="password" id="pw" autocomplete="current-password" required placeholder="••••"></label>
    <p class="form-err" id="loginErr" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    <a href="index.html" class="back">← Kembali ke toko</a>
  </form>
</section>

<!-- Dashboard -->
<div id="dash" hidden>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="index.html"><img src="assets/img/logo.svg" alt="" width="40" height="40"><span><span data-brand="split">Donat <b>Empuk</b></span> <small class="admin-tag">Admin</small></span></a>
      <div class="top-actions">
        <button class="btn btn-sm btn-ghost" id="refresh">Muat ulang</button>
        <button class="btn btn-sm btn-ghost" id="exportCsv">Export CSV</button>
        <button class="btn btn-sm btn-primary" id="logout">Keluar</button>
      </div>
    </div>
  </header>

  <main class="wrap admin-main">
    <p class="mode-info" id="modeInfo"></p>
    <div class="db-tools" id="dbTools" hidden>
      <button class="btn btn-sm btn-primary" id="dlSql">Download database.sql</button>
      <button class="btn btn-sm btn-ghost" id="dlSqlite">Download .sqlite</button>
      <button class="btn btn-sm btn-ghost" id="clearLocal" hidden>Sudah commit, muat ulang dari file</button>
    </div>

    <div class="stats">
      <div class="stat s1"><small>Total pesanan</small><b id="stOrders">0</b></div>
      <div class="stat s2"><small>Total box</small><b id="stBoxes">0</b></div>
      <div class="stat s3"><small>Total donat</small><b id="stPcs">0</b></div>
      <div class="stat s4"><small>Omzet (tanpa ongkir)</small><b id="stRev">Rp 0</b></div>
    </div>

    <div class="toolbar">
      <label class="search"><span class="sr">Cari</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Cari nama, no. HP, ID pesanan…"></label>
      <label class="sel"><span class="sr">Status</span>
        <select id="fStatus">
          <option value="">Semua status</option>
          <option value="baru">Baru</option>
          <option value="diproses">Diproses</option>
          <option value="dikirim">Dikirim</option>
          <option value="selesai">Selesai</option>
          <option value="batal">Batal</option>
        </select></label>
    </div>

    <details class="import" id="importBox">
      <summary>Impor pesanan dari link review WhatsApp</summary>
      <p class="muted">Tempel link review yang dikirim pelanggan via WhatsApp untuk memasukkan pesanan ke database.</p>
      <div class="import-row">
        <input id="impLink" placeholder="https://…/order.html?id=…&d=…">
        <button class="btn btn-sm btn-primary" id="impBtn">Impor</button>
      </div>
    </details>

    <div class="orders" id="orders"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/donut.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
